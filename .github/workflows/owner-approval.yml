name: Owner approval policy
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Review signal]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pull-requests: read
  statuses: write
concurrency:
  group: owner-approval-policy
  cancel-in-progress: false
jobs:
  approval:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted default-branch code only. Never check out or execute the PR head,
      # consume its artifacts, or interpolate its title/body into a script.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./.github/scripts/owner-approval.cjs').run({ github, context, core });
